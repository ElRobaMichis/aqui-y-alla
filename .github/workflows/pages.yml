# Publica public/ en GitHub Pages cada vez que se sube algo a main (si las pruebas pasan).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      # cada publicación = versión nueva de la caché del teléfono (sw.js)
      - run: sed -i "s/const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::10}';/" public/sw.js && grep -n "const VERSION" public/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
